<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fbff"><link rel="manifest" href="manifest.webmanifest"><title>ETF 股息追蹤器</title><style>:root{--bg:#f5f9fc;--card:#fff;--text:#152331;--muted:#72808e;--line:#dfe8ef;--accent:#5aa9e6;--accent2:#eaf5fd;--good:#31846a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:900px;margin:auto;padding:18px 14px 80px}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 18px}.head h1{font-size:24px;margin:0}.head small{color:var(--muted)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{display:block;font-size:22px;margin-top:6px}.muted{color:var(--muted);font-size:13px}.form{grid-template-columns:1fr 1fr 1fr 1fr auto;align-items:end}label{font-size:13px;color:var(--muted)}input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--text)}button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:var(--accent2);color:var(--text)}.danger{background:#fff0f0;color:#9b4242}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-title h2{font-size:17px;margin:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.ticker{font-weight:700}.amount{font-weight:700;white-space:nowrap}.months{grid-template-columns:repeat(3,1fr)}.month b{display:block;font-size:20px;margin-top:5px}.empty{text-align:center;padding:25px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.notice{font-size:12px;line-height:1.6;color:var(--muted)}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .card:first-child{grid-column:1/-1}.form{grid-template-columns:1fr}.months{grid-template-columns:1fr 1fr}.head{align-items:flex-start}.head small{display:block;margin-top:4px}}@media(prefers-color-scheme:dark){:root{--bg:#101820;--card:#18232d;--text:#edf5fb;--muted:#9aacba;--line:#2b3a46;--accent2:#203849}input{background:#111b23;color:var(--text)}}</style></head><body><main class="app"><div class="head"><div><h1>ETF 股息追蹤器</h1><small>持股資料只儲存在這台裝置</small></div><button id="install" class="secondary" hidden>安裝 App</button></div>
<section class="grid stats"><div class="card stat"><span class="muted">下一次預計領息</span><b id="next">—</b><span class="muted" id="nextDetail">尚無資料</span></div><div class="card stat"><span class="muted">未來已登錄股息</span><b id="future">NT$ 0</b></div><div class="card stat"><span class="muted">目前 ETF</span><b id="count">0 檔</b></div><div class="card stat"><span class="muted">目前總股數</span><b id="totalShares">0 股</b></div></section>
<div class="section-title"><h2>新增交易</h2></div><section class="card"><form id="form" class="grid form"><label>ETF 代號<input id="ticker" placeholder="例如 0056" required maxlength="12"></label><label>交易日期<input id="tradeDate" type="date" required></label><label>動作<select id="tradeType"><option value="buy">買進</option><option value="sell">賣出</option></select></label><label>股數<input id="shares" type="number" min="1" step="1" placeholder="1000" required></label><button class="primary">加入</button></form><div id="msg" class="muted" style="margin-top:10px">舊版資料會自動保留並轉成買進交易。</div></section>
<div class="section-title"><h2>配息公告</h2></div><section class="card"><form id="divForm" class="grid form"><label>ETF 代號<input id="divTicker" placeholder="0056" required maxlength="12"></label><label>除息日<input id="exDate" type="date" required></label><label>發放日<input id="payDate" type="date" required></label><label>每股配息<input id="dividend" type="number" min="0" step="0.0001" placeholder="1.07" required></label><button class="primary">加入公告</button></form><div class="notice" style="margin-top:10px">第一版採「本機持股＋本機配息公告」模式，完全不需要把持股傳到伺服器。之後可再接公開 ETF 配息資料自動更新。</div></section>
<div class="section-title"><h2>每月股息</h2></div><section id="months" class="grid months"></section>
<div class="section-title"><h2>待領股息</h2></div><section id="schedule" class="card"></section>
<div class="section-title"><h2>目前持股總計</h2></div><section id="portfolio" class="card"></section><div class="section-title"><h2>交易紀錄</h2><div class="toolbar"><button id="export" class="secondary">匯出備份</button><button id="importBtn" class="secondary">匯入備份</button><input id="importFile" type="file" accept="application/json" hidden><button id="clear" class="danger">清除資料</button></div></div><section id="holdings" class="card"></section>
<div class="section-title"><h2>已登錄配息</h2></div><section id="dividends" class="card"></section>
<p class="notice">判斷方式：買進日期早於除息日，即納入該次股息試算。實際權利資格仍以基金公司、交易所及券商紀錄為準。Safari 若清除網站資料，可能同時刪除此工具的本機紀錄，因此建議定期使用「匯出備份」。</p></main><script src="app.js?v=2"></script></body></html>
